[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inspectflow-edge"
version = "0.1.0"
description = "Local streaming inspection runtime with factory, freight and road profiles"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.scripts]
inspectflow = "edge_runtime.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["edge_runtime*"]

[tool.setuptools.package-data]
edge_runtime = ["static/*", "native/*.c", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
